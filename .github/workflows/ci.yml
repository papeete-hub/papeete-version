name: ci
on: [push, pull_request]

# NO CREDENTIAL. This pipeline reaches nothing outside its own checkout.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: the test suite
        run: uv run --extra dev pytest -q
      - name: build
        run: uv build
