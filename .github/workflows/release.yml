name: release
on:
  push:
    tags: ["v*"]

# PyPI Trusted Publishing (OIDC) — no token is stored anywhere. The one-time setup is a pending
# publisher on pypi.org naming this repo and this workflow; after the first release it becomes a
# normal publisher. See README.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build
        # No fetch step and no external token: the contract is committed here. A release
        # depends on nothing but this checkout and PyPI.
        run: uv build
      - name: verify the wheel actually computes a version
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe/bin/python -q dist/*.whl
          mkdir -p /tmp/probe-actor && cd /tmp/probe-actor
          git init -q
          git -c user.email=t@t -c user.name=t commit -q --allow-empty -m init
          git tag probe/v0.1.0
          test "$(/tmp/probe/bin/papeete-version compute . --name probe --label prod)" = "0.1.0"
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
