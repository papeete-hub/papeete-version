[project]
name = "papeete-version"
version = "0.1.1"
description = "Computes one actor's version — a semver core from its own git tag, a ciType-driven label, and a short SHA — for the Papeete ecosystem."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Papeete Consulting", email = "yoann.remy@outlook.com" }]
license = "MIT"
keywords = ["governance", "versioning", "semver", "actor-model"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
papeete-version = "papeete_version.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papeete_version"]
